# 매월 1일 00:15 UTC(한국 09:15)에 데이터 갱신 → 빌드 → gh-pages 브랜치로 배포 (GitHub Pages)
# Pages 소스: gh-pages 브랜치 / 루트. main 에 push 해도 빌드·배포가 다시 실행됩니다.
name: monthly-update-and-deploy

on:
  schedule:
    - cron: "15 0 1 * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Monthly data refresh (schedule / manual only)
        if: github.event_name != 'push'
        run: python3 scripts/update_monthly.py

      - name: Build site
        run: python3 build.py

      - name: Commit refreshed data to main (schedule / manual only)
        if: github.event_name != 'push'
        run: |
          git config user.name "arr-tracker-bot"
          git config user.email "arr-tracker-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "monthly update $(date -u +%Y-%m-%d)"
          git push

      - name: Publish to gh-pages
        run: |
          rm -rf _site && mkdir _site
          cp index.html data.json computed.json _site/
          cp -r exports _site/
          touch _site/.nojekyll
          cd _site
          git init -b gh-pages
          git config user.name "arr-tracker-bot"
          git config user.email "arr-tracker-bot@users.noreply.github.com"
          git add -A
          git commit -m "deploy $(date -u +%Y-%m-%dT%H:%MZ) from ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
